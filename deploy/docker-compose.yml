# SmartGateway - standalone deployment (no source code needed on this host).
#
#   1. Load the image:   gunzip -c smartgateway-image.tar.gz | docker load      (or: docker pull <your-registry>/smartgateway)
#   2. Configure:        cp .env.example .env   and edit it
#   3. Start:            docker compose up -d                  (add  --profile redis  for the optional Redis cache)
#   4. Open:             http://<host>:${SG_PORT:-8080}
#
# Data (SQLite DB, encryption key, stress-test history) lives in the `sg-data` volume.
services:
  smartgateway:
    image: ${SG_IMAGE:-smartgateway:latest}
    ports:
      - "${SG_BIND:-0.0.0.0}:${SG_PORT:-8080}:8080"   # SG_BIND=127.0.0.1 publishes the port on this host only (put a TLS reverse proxy in front)
    environment:
      SG_ADMIN_PASSWORD: "${SG_ADMIN_PASSWORD:-}"   # set this: it enables the login for the UI + management API
      SG_ADMIN_USER: "${SG_ADMIN_USER:-admin}"
      SG_SECRET_KEY: "${SG_SECRET_KEY:-}"            # encrypts upstream API keys; empty = auto-generated in the data volume
      SG_CORS_ORIGINS: "${SG_CORS_ORIGINS:-}"        # e.g. https://app.example.com for browser clients
      SG_REDIS_URL: "${SG_REDIS_URL:-}"              # e.g. redis://redis:6379/0 (can also be set in Settings)
      SG_DEFAULT_SLOTS: "${SG_DEFAULT_SLOTS:-4}"
      # TLS (optional): mount a cert dir below and set both
      SG_SSL_CERT: "${SG_SSL_CERT:-}"
      SG_SSL_KEY: "${SG_SSL_KEY:-}"
    volumes:
      - sg-data:/data
      # - ./certs:/certs:ro
    restart: unless-stopped

  redis:
    profiles: [redis]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - sg-redis:/data
    restart: unless-stopped

volumes:
  sg-data:
  sg-redis:
